name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Check code formatting (spotless)
        run: ./gradlew spotlessCheck
      
      - name: Generate protobuf classes
        run: ./gradlew :protocol:generateProto
      
      - name: Build
        run: ./gradlew build -x test
      
      - name: Run tests
        run: ./gradlew test
      
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  protoc-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Regenerate protobuf
        run: |
          rm -rf protocol/build/generated
          ./gradlew :protocol:generateProto
      
      - name: Check for uncommitted protobuf changes
        run: |
          if [ -n "$(git status --porcelain protocol/build/generated)" ]; then
            echo "Error: Generated protobuf files are out of sync"
            git diff protocol/build/generated
            exit 1
          fi
